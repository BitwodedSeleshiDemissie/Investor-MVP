services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ariete-investor-portal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_DIR: /var/log/ariete
      LOG_FILE_NAME: application.log
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./runtime/logs:/var/log/ariete
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
